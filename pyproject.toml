[project]
name = "meeting-tool"
version = "0.1.0"
description = "Vietnamese meeting audio -> transcript -> biên bản họp, via multimodal LLMs"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pydub>=0.25",
    "audioop-lts>=0.2; python_version >= '3.13'",
    "litellm>=1.50",
    "stamina>=24.2",
    "jinja2>=3.1",
    "python-docx>=1.1",
    "pyyaml>=6.0",
]

[project.scripts]
meeting-tool = "meeting_tool.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml",
    "jiwer>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meeting_tool"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["pydub.*", "litellm.*", "jiwer.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["live: calls real LLM APIs (needs API keys; run with -m live)"]
